name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar paquetes internos (db, core, ui)
        run: npm run build -w @clinicflow/db -w @clinicflow/core -w @clinicflow/ui

      - name: Typecheck (todos los workspaces)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests core
        run: npm test
