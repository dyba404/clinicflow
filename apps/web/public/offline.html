<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión - Clinicflow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1c1917;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      .icono {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        border-radius: 0.75rem;
        background: #0d9488;
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 3rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #57534e;
        margin: 0 0 1.5rem;
      }
      button {
        border: 0;
        border-radius: 0.5rem;
        background: #0d9488;
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.625rem 1.25rem;
        cursor: pointer;
      }
      button:hover {
        background: #0f766e;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icono">O</div>
      <h1>Estás sin conexión</h1>
      <p>
        Revisa tu conexión a internet. La aplicación volverá a funcionar automáticamente cuando
        regreses a estar en línea.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
